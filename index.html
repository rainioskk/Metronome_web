<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f4f2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Metronome-web" />
    <meta name="description" content="适合乐器日常练习的在线节拍器。" />
    <title>Metronome-web</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <h1>Metronome-web</h1>
        </div>

        <div class="top-actions">
          <button
            class="wake-toggle"
            id="wakeLockToggle"
            type="button"
            role="switch"
            aria-checked="true"
            data-enabled="true"
            data-runtime="idle"
          >
            <span class="wake-led" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect width="14" height="11" x="5" y="11" rx="2"></rect>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
            <span class="wake-copy">
              <span data-i18n="wake.label">防休眠</span>
              <small id="wakeStateLabel">待机</small>
            </span>
            <span class="wake-switch" aria-hidden="true"><span></span></span>
          </button>

          <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            data-i18n-aria-label="theme.toDark"
            aria-label="切换到深色模式"
          >
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <label class="language-control">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"></path>
            </svg>
            <span class="sr-only" data-i18n="language.label">语言</span>
            <select id="languageSelect" aria-label="语言">
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="es">Español</option>
            </select>
          </label>
        </div>
      </header>

      <main class="metro-layout">
        <section class="tempo-section" aria-labelledby="tempoTitle">
          <div class="section-heading">
            <h2 id="tempoTitle" data-i18n="tempo.title">速度</h2>
            <span class="sr-only" id="audioState" aria-live="polite">等待开始</span>
          </div>

          <div class="bpm-control">
            <button
              class="step-button"
              id="decreaseTempo"
              type="button"
              data-i18n-aria-label="tempo.decrease"
              aria-label="速度减一"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg>
            </button>

            <label class="bpm-readout" for="bpmInput">
              <span class="bpm-value">
                <input
                  id="bpmInput"
                  type="number"
                  min="1"
                  max="240"
                  value="120"
                  inputmode="numeric"
                  data-i18n-aria-label="tempo.bpm"
                  aria-label="每分钟节拍数"
                />
                <span class="bpm-unit">BPM</span>
                <span class="beat-lamp" id="beatLamp" aria-hidden="true"></span>
              </span>
              <span class="tempo-mark-readout">
                <span class="tempo-mark" id="tempoMark">小快板</span>
                <small class="tempo-mark-meaning" id="tempoMarkMeaning">轻快，但比快板稍慢</small>
              </span>
            </label>

            <button
              class="step-button"
              id="increaseTempo"
              type="button"
              data-i18n-aria-label="tempo.increase"
              aria-label="速度加一"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
            </button>
          </div>

          <input
            class="tempo-range"
            id="tempoRange"
            type="range"
            min="1"
            max="240"
            step="1"
            value="120"
            data-i18n-aria-label="tempo.range"
            aria-label="调整速度"
          />
          <div class="tempo-scale" aria-hidden="true">
            <span>1</span>
            <span>80</span>
            <span>160</span>
            <span>240</span>
          </div>

          <div class="tempo-marking-section">
            <span class="tempo-markings-label" data-i18n="tempo.markings.group">速度标记</span>
            <div
              class="tempo-markings"
              id="tempoMarkingOptions"
              role="radiogroup"
              aria-label="选择速度标记"
            ></div>
          </div>
        </section>

        <section
          class="settings-section"
          data-i18n-aria-label="settings.title"
          aria-label="节拍设置"
        >
          <div class="setting-row">
            <span class="setting-label" data-i18n="subdivision.label">细分</span>
            <div
              class="subdivision-options"
              id="subdivisionOptions"
              role="radiogroup"
              data-i18n-aria-label="subdivision.group"
              aria-label="选择每拍细分节奏"
            ></div>
          </div>

          <div class="setting-row accent-row">
            <div class="accent-controls">
              <div class="accent-control-group">
                <span class="setting-label" data-i18n="accent.label">强拍</span>
                <button
                  class="accent-toggle"
                  id="accentToggle"
                  type="button"
                  role="switch"
                  aria-checked="true"
                  data-enabled="true"
                >
                  <span class="switch-track" aria-hidden="true"><span></span></span>
                  <span data-i18n="accent.toggle">强调重音</span>
                </button>
              </div>

              <div class="accent-control-group">
                <span class="setting-label" data-i18n="accent.beats">节拍</span>
                <div
                  class="accent-stepper"
                  role="group"
                  data-i18n-aria-label="accent.interval"
                  aria-label="重音间隔"
                >
                  <button
                    class="accent-step-button"
                    id="decreaseAccentInterval"
                    type="button"
                    data-i18n-aria-label="accent.decrease"
                    aria-label="减少节拍"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg>
                  </button>
                  <output
                    class="accent-interval-value"
                    id="accentIntervalValue"
                    aria-live="polite"
                  >4</output>
                  <button
                    class="accent-step-button"
                    id="increaseAccentInterval"
                    type="button"
                    data-i18n-aria-label="accent.increase"
                    aria-label="增加节拍"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M12 5v14M5 12h14"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <div
        class="transport"
        role="group"
        data-i18n-aria-label="playback.group"
        aria-label="播放控制"
      >
        <button
          class="play-button"
          id="playButton"
          type="button"
          data-i18n-aria-label="playback.startAria"
          aria-label="开始节拍"
        >
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 4 12 8-12 8z"></path>
          </svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14M16 5v14"></path>
          </svg>
          <span id="playText" data-i18n="playback.start">开始</span>
        </button>

        <label class="volume-control" for="volumeRange">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4z"></path>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <span class="sr-only" data-i18n="volume.label">音量</span>
          <input
            id="volumeRange"
            type="range"
            min="0"
            max="100"
            step="1"
            value="72"
            data-i18n-aria-label="volume.label"
            aria-label="音量"
          />
          <output id="volumeOutput" for="volumeRange">72%</output>
        </label>
      </div>
    </div>
  </body>
</html>
